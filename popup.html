<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Cookie Transfer</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 13px;
        margin: 10px;
        min-width: 300px;
        text-align: center;
      }

      button {
        padding: 6px 10px;
        margin: 4px 0;
        font-size: 13px;
        min-width: 260px;
      }

      .group {
        margin-bottom: 10px;
      }

      .hint {
        color: #777;
        font-size: 11px;
        line-height: 1.5;
      }

      #siteList {
        width: 260px;
        height: 44px;
        margin: 4px 0;
        font-size: 12px;
        resize: vertical;
      }

      #scope,
      #conc {
        display: block;
        width: 260px;
        margin: 6px auto 2px;
        text-align: left;
        font-size: 12px;
      }

      #concurrency {
        width: 52px;
        margin-left: 6px;
        font-size: 12px;
      }

      #status {
        margin-top: 8px;
        min-height: 16px;
        color: #333;
        text-align: left;
      }

      input[type="file"] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h3>Cookie Transfer</h3>

    <div class="group">
      <div>
        <button id="exportBtn">导出Cookies</button>
      </div>

      <div>
        <button id="importBtn">导入Cookies</button>
        <input type="file" id="fileInput" accept="application/json" />
      </div>
    </div>

    <div class="group">
      <div>
        <button id="exportDataBtn">导出网站数据</button>
      </div>

      <div>
        <button id="importDataBtn">导入网站数据</button>
        <input type="file" id="dataFileInput" accept="application/json" />
      </div>

      <label id="scope">
        <input type="checkbox" id="useBrowserList" />
        自动收集浏览器里的网站（正在打开的、有 Cookie 的、历史访问过的）
      </label>
      <textarea
        id="siteList"
        placeholder="要迁移的网址，一行一个。留空就只用上面自动收集的。"
      ></textarea>

      <label id="conc">
        同时干活的数量
        <input type="number" id="concurrency" min="1" max="20" step="1" value="3" />
      </label>
      <div class="hint">
        后台同时开几个页面一起搬，最多 20。调高不一定更快，还很吃内存；网站少时会自动少开。
      </div>

      <div class="hint">
        网站数据 = 每个网站的本地存储 + 它的数据库（IndexedDB，含文件）。<br />
        不用联网，断网也能用；干活时会另外开一个小窗口在后台跑，完事自己关掉，别手动去关它。
      </div>
    </div>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
